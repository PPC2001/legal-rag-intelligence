# ─────────────────────────────────────────────────────────────
#  Legal RAG QA — Cloud-Native Stack (Neon DB + Redis + MinIO)
#  Services: API, Celery Worker, Redis, MinIO
#  Database: Neon Serverless PostgreSQL with pgvector
# ─────────────────────────────────────────────────────────────
services:
  # ── 1. FastAPI Web API ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-rag-api
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-legal-documents}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-}
    ports:
      - "${PORT:-8001}:8000"
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── 2. Celery Background Ingestion Worker ────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-rag-worker
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-legal-documents}
    volumes:
      - app-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  # ── 3. Redis (Task Broker & Semantic Cache) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: legal-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── 4. MinIO (S3-Compatible Object Storage) ──────────────────
  minio:
    image: minio/minio:latest
    container_name: legal-rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console UI
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  app-data:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
